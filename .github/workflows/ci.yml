name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test --workspace pubgame-fe -- --watch=false

  backend:
    name: Backend (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test
        working-directory: apps/backend
        run: mvn -B test

  simulation:
    name: Simulazione leggera (8 giocatori, 3 round)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Avvia il backend
        working-directory: apps/backend
        env:
          CONTROL_SECRET: ci-secret-ci-secret-ci-secret-32
          DB_URL: jdbc:h2:file:./data/ci;DB_CLOSE_DELAY=-1
          ALLOWED_ORIGINS: http://127.0.0.1:4200
          SERVER_PORT: '8090'
        run: |
          mvn -B -DskipTests spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8090/health > /dev/null && exit 0
            sleep 2
          done
          echo "backend non pronto"; tail -50 /tmp/backend.log; exit 1
      - name: Partita simulata corta
        env:
          API: http://127.0.0.1:8090
          WS_URL: ws://127.0.0.1:8090/ws-pubgame
          CONTROL_SECRET: ci-secret-ci-secret-ci-secret-32
          PLAYERS: '8'
          STATE_PATH: ${{ github.workspace }}/sim-state.json
          ACTIONS_PATH: ${{ github.workspace }}/sim-actions.jsonl
          SUMMARY_PATH: ${{ github.workspace }}/sim-summary.json
        run: |
          node scripts/sim/full-match.mjs setup
          node scripts/sim/full-match.mjs run &
          SIM_PID=$!
          for i in $(seq 1 120); do
            if [ -f "$SUMMARY_PATH" ]; then break; fi
            sleep 5
          done
          kill $SIM_PID 2>/dev/null || true
          test -f "$SUMMARY_PATH" || (echo "simulazione non conclusa"; exit 1)
