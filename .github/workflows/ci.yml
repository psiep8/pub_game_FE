name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Contratto simulazione (40 round + 5 bonus)
        run: npm run test:sim
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test --workspace pubgame-fe -- --watch=false

  banks:
    name: Banche (audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Audit banche
        run: node scripts/audit-banche.mjs --ci

  backend:
    name: Backend (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test
        working-directory: apps/backend
        run: mvn -B test
      # Se qualcosa si rompe, il log della CI deve dire quale test: senza
      # questo passaggio il job finisce rosso con il solo "BUILD FAILURE".
      - name: Report dei test falliti
        if: failure()
        working-directory: apps/backend
        shell: bash
        run: |
          shopt -s nullglob
          for report in target/surefire-reports/*.txt; do
            if grep -qE 'Failures: [1-9]|Errors: [1-9]' "$report"; then
              echo "::group::$report"
              cat "$report"
              echo "::endgroup::"
            fi
          done

  simulation:
    name: Simulazione leggera (8 giocatori, 3 round)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Avvia il backend
        working-directory: apps/backend
        env:
          CONTROL_SECRET: ci-secret-ci-secret-ci-secret-32
          DB_URL: jdbc:h2:file:./data/ci;DB_CLOSE_DELAY=-1
          ALLOWED_ORIGINS: http://127.0.0.1:4200
          SERVER_PORT: '8090'
        run: |
          mvn -B -DskipTests spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8090/health > /dev/null && exit 0
            sleep 2
          done
          echo "backend non pronto"; tail -50 /tmp/backend.log; exit 1
      - name: Partita simulata corta
        env:
          API: http://127.0.0.1:8090
          WS_URL: ws://127.0.0.1:8090/ws-pubgame
          CONTROL_SECRET: ci-secret-ci-secret-ci-secret-32
          PLAYERS: '8'
          ROUNDS_LIMIT: '3'
          STATE_PATH: ${{ github.workspace }}/sim-state.json
          ACTIONS_PATH: ${{ github.workspace }}/sim-actions.jsonl
          SUMMARY_PATH: ${{ github.workspace }}/sim-summary.json
        run: |
          node scripts/sim/full-match.mjs setup
          node scripts/sim/full-match.mjs run &
          SIM_PID=$!
          for i in $(seq 1 120); do
            if [ -f "$SUMMARY_PATH" ]; then break; fi
            sleep 5
          done
          kill $SIM_PID 2>/dev/null || true
          test -f "$SUMMARY_PATH" || (echo "simulazione non conclusa"; exit 1)

  reproducibility:
    name: Riproducibilità (backend + E2E, checkout pulito)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verifica checkout senza indice media
        shell: bash
        run: |
          found=$(find apps/backend -name media-it.json -print -quit)
          if [ -n "$found" ]; then
            echo "::error::media-it.json presente nel checkout pulito: $found"
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Suite backend completa
        working-directory: apps/backend
        run: ./mvnw -B test
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dipendenze
        run: npm ci
      - name: Browser E2E
        run: npx playwright install --with-deps chromium
      - name: E2E da checkout pulito
        env:
          E2E_BACKEND_PORT: '8095'
          E2E_FRONTEND_PORT: '4295'
        run: >-
          npx playwright test e2e/tv-telefoni.spec.ts e2e/musica-5-manche.spec.ts
          e2e/classifica-film.spec.ts --output=test-results-ci
      - name: Verifica che l'indice media non sia comparso
        shell: bash
        run: |
          found=$(find apps/backend -name media-it.json -print -quit)
          if [ -n "$found" ]; then
            echo "::error::media-it.json creato durante i test: $found"
            exit 1
          fi
      - name: Report dei test backend falliti
        if: failure()
        working-directory: apps/backend
        shell: bash
        run: |
          shopt -s nullglob
          for report in target/surefire-reports/*.txt; do
            if grep -qE 'Failures: [1-9]|Errors: [1-9]' "$report"; then
              echo "::group::$report"
              cat "$report"
              echo "::endgroup::"
            fi
          done
      - name: Salva trace e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: riproducibilita-ci
          path: |
            test-results-ci
            apps/backend/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7
