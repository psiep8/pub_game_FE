<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PubGame — simulazione TV + telefono</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #111109;
      --bg-1: #1a1a10;
      --paper: #f1e4c9;
      --paper-hi: #fff8e8;
      --paper-2: #e3d2ae;
      --coal: #15150f;
      --acid: #d9ff43;
      --tomato: #ff4d2e;
      --mustard: #ffc53d;
      --font-display: 'Anton', Impact, 'Arial Black', sans-serif;
      --font-mono: 'Space Mono', 'Courier New', monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: var(--bg-0); color: var(--paper);
      font-family: var(--font-mono);
    }
    body { display: flex; flex-direction: column; gap: 10px; padding: 10px; }

    .topbar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 42px; padding: 7px 16px;
      background: var(--paper); color: var(--coal);
      border: 3px solid var(--coal);
      box-shadow: 6px 6px 0 var(--tomato);
    }
    .brand {
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 1.7vw, 1.55rem);
      letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
    }
    .brand span { color: var(--tomato); }
    .topbar-note {
      padding: 3px 8px; background: var(--acid); color: var(--coal);
      border: 2px solid var(--coal);
      font-size: .62rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    }

    .duo {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(270px, 24vw, 390px);
      gap: 10px;
    }
    .pane {
      min-width: 0; min-height: 0;
      display: flex; flex-direction: column;
      background: var(--paper-2);
      border: 2px solid var(--coal);
      box-shadow: 5px 5px 0 var(--coal);
      overflow: hidden;
    }
    .pane-head {
      flex: 0 0 auto;
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      padding: 5px 9px 4px;
      background: var(--paper); color: var(--coal);
      border-bottom: 2px solid var(--coal);
      font-size: clamp(.6rem, .78vw, .78rem);
      font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    }
    .pane-head strong {
      font-family: var(--font-display); font-size: 1.25em;
      font-weight: 400; letter-spacing: .05em;
    }
    .pane-head .tag {
      padding: 2px 6px; border: 2px solid var(--coal);
      font-size: .58rem; letter-spacing: .08em;
    }
    .pane.tv .tag { background: var(--acid); }
    .pane.phone .tag { background: var(--tomato); color: var(--paper-hi); }

    .viewport {
      position: relative; flex: 1; min-height: 0; overflow: hidden;
      background: var(--bg-1);
    }
    .viewport iframe {
      position: absolute; top: 50%; left: 50%; display: block;
      border: 0; background: var(--bg-0);
      transform-origin: center center;
    }
    .hidden-frames iframe {
      position: fixed; left: -12000px; top: 0;
      border: 0; opacity: 0; pointer-events: none;
    }
    .pane.phone .viewport { background: var(--paper-2); }

    .rush {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px; background: var(--paper-2);
      border: 2px solid var(--coal); box-shadow: 4px 4px 0 var(--coal);
      overflow-x: auto; scrollbar-width: thin;
    }
    .rush-group { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
    .rush-label {
      flex: 0 0 auto; padding-right: 4px;
      font-size: .55rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    }
    .rush button {
      flex: 0 0 auto; padding: 3px 7px;
      background: var(--paper); color: var(--coal);
      border: 2px solid var(--coal);
      font-family: var(--font-mono); font-size: .56rem; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
    }
    .rush button:hover { background: var(--paper-hi); }
    .rush button.on { background: var(--acid); }
    .rush button.play { background: var(--tomato); color: var(--paper-hi); }

    @media (max-width: 900px) {
      body { padding: 6px; gap: 6px; }
      .topbar { min-height: 34px; padding: 5px 10px; }
      .topbar-note { display: none; }
      .duo { gap: 6px; grid-template-columns: minmax(0, 1fr) 240px; }
      .pane { box-shadow: 3px 3px 0 var(--coal); }
      .pane-head { padding: 3px 6px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Pub Game <span>/ simulazione</span></div>
    <div class="topbar-note" id="sim-note">13 GIOCHI · 4 BONUS</div>
  </header>

  <nav class="rush" id="rush" aria-label="Rush TV e telefono"></nav>

  <main class="duo">
    <section class="pane tv" aria-label="TV">
      <div class="pane-head"><strong>01 / TV</strong><span class="tag">1280×720</span></div>
      <div class="viewport"><iframe id="tv" data-w="1280" data-h="720" title="TV PubGame"></iframe></div>
    </section>

    <section class="pane phone" aria-label="Telefono del concorrente">
      <div class="pane-head"><strong id="phone-name">02 / TELEFONO</strong><span class="tag" id="phone-tag">390×844</span></div>
      <div class="viewport"><iframe id="phone" data-w="390" data-h="844" title="Telefono concorrente"></iframe></div>
    </section>
  </main>

  <div class="hidden-frames" aria-hidden="true">
    <iframe id="admin" data-w="1280" data-h="800" title="Admin simulazione"></iframe>
    <iframe id="anna" data-w="390" data-h="844" title="Telefono Anna"></iframe>
    <iframe id="bruno" data-w="390" data-h="844" title="Telefono Bruno"></iframe>
    <iframe id="carla" data-w="390" data-h="844" title="Telefono Carla"></iframe>
    <iframe id="dario" data-w="390" data-h="844" title="Telefono Dario"></iframe>
  </div>

  <script>
    (() => {
      const q = new URLSearchParams(location.search);
      const port = location.port ? `:${location.port}` : '';
      const base = `http://localhost${port}`;
      const game = Number(q.get('game')) || 0;
      const names = ['Anna', 'Bruno', 'Carla', 'Dario'];
      const watch = (q.get('watch') || names[Math.floor(Math.random() * names.length)]).trim();
      const watchKey = watch.toLowerCase();

      const token = (key) => q.get(key) || '';
      const boot = (host, role, tok, name, device) => {
        const params = new URLSearchParams({
          game: String(game), role, token: tok, name, device,
        });
        return `${host}/sim-boot.html?${params.toString()}`;
      };
      const hostFor = (name) => `http://${name.toLowerCase()}.localhost${port}`;

      document.getElementById('phone-name').textContent = `02 / ${watch.toUpperCase()}`;
      document.getElementById('phone-tag').textContent = watch.toUpperCase();
      document.getElementById('sim-note').textContent =
        `PARTITA #${game} · ${watch.toUpperCase()} IN ONDA · 13 GIOCHI + 4 BONUS`;

      document.getElementById('tv').src = boot(base, 'TV', token('tv'), '', 'sim-tv');
      document.getElementById('admin').src = boot(base, 'ADMIN', token('admin'), '', 'sim-admin');

      const visiblePhone = document.getElementById('phone');
      visiblePhone.src = boot(hostFor(watch), 'REMOTE', token(watchKey), watch, `sim-${watchKey}`);

      for (const name of names) {
        if (name === watch) continue;
        const frame = document.getElementById(name.toLowerCase());
        if (!frame) continue;
        frame.src = boot(hostFor(name), 'REMOTE', token(name.toLowerCase()), name, `sim-${name.toLowerCase()}`);
      }

      const frames = Array.from(document.querySelectorAll('.viewport iframe'));
      const fit = (frame) => {
        const viewport = frame.parentElement;
        const width = Number(frame.dataset.w) || 1280;
        const height = Number(frame.dataset.h) || 720;
        const scale = Math.min(viewport.clientWidth / width, viewport.clientHeight / height);
        frame.style.width = `${width}px`;
        frame.style.height = `${height}px`;
        frame.style.transform = `translate(-50%, -50%) scale(${scale})`;
      };
      const fitAll = () => frames.forEach(fit);
      if ('ResizeObserver' in window) {
        const observer = new ResizeObserver(fitAll);
        frames.forEach((frame) => observer.observe(frame.parentElement));
      }
      window.addEventListener('resize', fitAll);
      fitAll();

      // ---------------------------------------------------------------- Rush
      // Ogni voce apre la scheda TV del gioco/bonus: i copioni demo sono
      // grafica vera della TV, non aprono round e non toccano la partita.
      const GAMES = [
        ['QUIZ', 'QUIZ'], ['MUSIC', 'MUSICA'], ['IMAGE_BLUR', 'IMMAGINI'],
        ['WHEEL_OF_FORTUNE', 'RUOTA'], ['TIMELINE', 'TIMELINE'], ['TIME_BUZZER', 'TEMPO'],
        ['BOMBA', 'BOMBA'], ['AIR_HOCKEY_BATTLE', 'HOCKEY'], ['ULTIMA_SPIAGGIA', 'SPIAGGIA'],
        ['AZZARDO', 'AZZARDO'], ['BLACKJACK', 'BLACKJACK'], ['ARENA', 'ARENA'],
        ['SPEED_RUSH', 'SPEED RUSH'],
      ].map(([key, label]) => ({ kind: 'demo', key, label }));
      const BONUSES = [
        ['casino', 'CASINO'], ['basket', 'BASKET'], ['cavallo', 'CAVALLO'], ['biglie', 'BIGLIE'],
      ].map(([id, label]) => ({ kind: 'bonus', id, label, key: `BONUS_${id.toUpperCase()}` }));
      const RUSH = [...GAMES, ...BONUSES];

      const bar = document.getElementById('rush');
      const tv = document.getElementById('tv');
      const phone = document.getElementById('phone');
      const note = document.getElementById('sim-note');
      let current = -1;
      let auto = null;
      const chips = [];

      const group = (label, items) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'rush-group';
        const title = document.createElement('span');
        title.className = 'rush-label';
        title.textContent = label;
        wrapper.append(title);
        for (const item of items) {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.textContent = item.label;
          chip.dataset.index = String(RUSH.indexOf(item));
          chip.addEventListener('click', () => select(Number(chip.dataset.index)));
          chips.push(chip);
          wrapper.append(chip);
        }
        bar.append(wrapper);
        return wrapper;
      };

      const status = (text) => {
        note.textContent = text;
      };

      const select = (index) => {
        if (index < 0 || index >= RUSH.length) return;
        current = index;
        const item = RUSH[index];
        chips.forEach((chip, i) => chip.classList.toggle('on', i === index));
        tv.src = item.kind === 'demo'
          ? `${base}/tv?sim=1&demo=${encodeURIComponent(item.key)}`
          : `${base}/bonus-preview/${encodeURIComponent(item.id)}`;
        // Telefono: la scheda "come si vota" del manuale vero, aperta sul gioco.
        phone.src = `${hostFor(watch)}/play?quad=1&manuale=${encodeURIComponent(item.key)}`;
        status(`${index + 1}/${RUSH.length} · ${item.label} · PARTITA #${game || '—'}`);
        updateAuto();
      };

      const updateAuto = () => {
        playBtn.classList.toggle('play', !!auto);
        playBtn.textContent = auto ? '⏸ RUSH' : '▶ RUSH';
      };

      const step = () => select((current + 1) % RUSH.length);
      const toggleAuto = () => {
        if (auto) {
          clearInterval(auto);
          auto = null;
          updateAuto();
          status(`PAUSA · ${current >= 0 ? RUSH[current].label : 'nessuna scheda'}`);
          return;
        }
        if (current < 0) select(0);
        auto = setInterval(step, 7000);
        updateAuto();
      };

      group('GIOCHI', GAMES);
      group('BONUS', BONUSES);
      const playBtn = document.createElement('button');
      playBtn.type = 'button';
      playBtn.textContent = '▶ RUSH';
      playBtn.title = 'Avanza da solo ogni 7 secondi';
      playBtn.addEventListener('click', toggleAuto);
      bar.append(playBtn);
      const normalBtn = document.createElement('button');
      normalBtn.type = 'button';
      normalBtn.textContent = 'TV LIVE';
      normalBtn.title = 'Torna alla TV della simulazione';
      normalBtn.addEventListener('click', () => {
        if (auto) toggleAuto();
        current = -1;
        chips.forEach((chip) => chip.classList.remove('on'));
        tv.src = boot(base, 'TV', token('tv'), '', 'sim-tv');
        phone.src = boot(hostFor(watch), 'REMOTE', token(watchKey), watch, `sim-${watchKey}`);
        status(`PARTITA #${game || '—'} · ${watch.toUpperCase()} IN ONDA · TV LIVE`);
      });
      bar.append(normalBtn);

      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight') { event.preventDefault(); step(); }
        if (event.key === 'ArrowLeft') { event.preventDefault(); select((current - 1 + RUSH.length) % RUSH.length); }
        if (event.key === ' ') { event.preventDefault(); toggleAuto(); }
      });
    })();
  </script>
</body>
</html>
