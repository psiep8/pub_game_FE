<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PubGame — Regia quad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #111109;
      --bg-1: #1a1a10;
      --paper: #f1e4c9;
      --paper-hi: #fff8e8;
      --paper-2: #e3d2ae;
      --coal: #15150f;
      --acid: #d9ff43;
      --tomato: #ff4d2e;
      --mustard: #ffc53d;
      --mint: #8be3c4;
      --font-display: 'Anton', Impact, 'Arial Black', sans-serif;
      --font-mono: 'Space Mono', 'Courier New', monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg-0);
      color: var(--paper);
      font-family: var(--font-mono);
    }

    body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 42px;
      padding: 7px 16px;
      background: var(--paper);
      color: var(--coal);
      border: 3px solid var(--coal);
      box-shadow: 6px 6px 0 var(--tomato);
    }

    .brand {
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 1.7vw, 1.55rem);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand span {
      color: var(--tomato);
    }

    .topbar-note {
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: right;
    }

    .quad {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--paper-2);
      border: 2px solid var(--coal);
      box-shadow: 5px 5px 0 var(--coal);
      overflow: hidden;
    }

    .pane-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 5px 9px 4px;
      background: var(--paper);
      color: var(--coal);
      border-bottom: 2px solid var(--coal);
      font-size: clamp(0.6rem, 0.78vw, 0.78rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .pane-head strong {
      font-family: var(--font-display);
      font-size: 1.25em;
      font-weight: 400;
      letter-spacing: 0.05em;
    }

    .pane-head .tag {
      padding: 2px 6px;
      border: 2px solid var(--coal);
      font-size: 0.58rem;
      letter-spacing: 0.08em;
    }

    .pane.tv .tag { background: var(--acid); }
    .pane.admin .tag { background: var(--mustard); }
    .pane.anna .tag { background: var(--mint); }
    .pane.bruno .tag { background: var(--tomato); color: var(--paper-hi); }

    .viewport {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--bg-1);
    }

    .viewport iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      border: 0;
      background: var(--bg-0);
      transform-origin: center center;
    }

    @media (max-width: 900px) {
      body { padding: 6px; gap: 6px; }
      .topbar { min-height: 34px; padding: 5px 10px; }
      .topbar-note { display: none; }
      .quad { gap: 6px; }
      .pane { box-shadow: 3px 3px 0 var(--coal); }
      .pane-head { padding: 3px 6px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Pub Game <span>/ regia</span></div>
    <div class="topbar-note">TV + ADMIN + 2 telefoni · stessa partita</div>
  </header>

  <main class="quad">
    <section class="pane tv" aria-label="TV">
      <div class="pane-head"><strong>01 / TV</strong><span class="tag">1280×720</span></div>
      <div class="viewport"><iframe data-w="1280" data-h="720" title="TV PubGame"></iframe></div>
    </section>

    <section class="pane admin" aria-label="Admin">
      <div class="pane-head"><strong>02 / Admin</strong><span class="tag">1280×800</span></div>
      <div class="viewport"><iframe data-w="1280" data-h="800" title="Admin PubGame"></iframe></div>
    </section>

    <section class="pane anna" aria-label="Telefono Anna">
      <div class="pane-head"><strong>03 / Anna</strong><span class="tag">390×844</span></div>
      <div class="viewport"><iframe data-w="390" data-h="844" title="Telefono Anna"></iframe></div>
    </section>

    <section class="pane bruno" aria-label="Telefono Bruno">
      <div class="pane-head"><strong>04 / Bruno</strong><span class="tag">390×844</span></div>
      <div class="viewport"><iframe data-w="390" data-h="844" title="Telefono Bruno"></iframe></div>
    </section>
  </main>

  <script>
    (() => {
      const port = location.port ? `:${location.port}` : '';
      const protocol = location.protocol === 'https:' ? 'https:' : 'http:';
      const base = `${protocol}//localhost${port}`;
      const remote = (name) =>
        `${protocol}//${name.toLowerCase()}.localhost${port}/play?quad=1&nickname=${encodeURIComponent(name)}`;

      const urls = [
        `${base}/tv`,
        `${base}/admin`,
        remote('Anna'),
        remote('Bruno'),
      ];

      const frames = Array.from(document.querySelectorAll('.viewport iframe'));

      frames.forEach((frame, index) => {
        frame.src = urls[index];
      });

      const fit = (frame) => {
        const viewport = frame.parentElement;
        const width = Number(frame.dataset.w) || 1280;
        const height = Number(frame.dataset.h) || 720;
        const scale = Math.min(viewport.clientWidth / width, viewport.clientHeight / height);
        frame.style.width = `${width}px`;
        frame.style.height = `${height}px`;
        frame.style.transform = `translate(-50%, -50%) scale(${scale})`;
      };

      const fitAll = () => frames.forEach(fit);

      if ('ResizeObserver' in window) {
        const observer = new ResizeObserver(fitAll);
        frames.forEach((frame) => observer.observe(frame.parentElement));
        window.addEventListener('resize', fitAll);
      } else {
        window.addEventListener('resize', fitAll);
      }

      fitAll();
    })();
  </script>
</body>
</html>
