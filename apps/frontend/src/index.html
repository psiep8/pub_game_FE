<!doctype html>
<html lang="it" data-theme="editorial-acid">
<head>
  <meta charset="utf-8">
  <title>quizzOne</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="quizzOne">
  <meta name="application-name" content="quizzOne">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111109">
  <script>
    // Tema prima del primo paint: sette slug validi, più i due nomi storici.
    try {
      var themes = ['editorial-acid', 'desert-heritage', 'arctic-noir', 'deep-ocean', 'kpop-aesthetic', 'neon-cyberpunk', 'sunset-pop', 'premium-gold'];
      var legacy = { ink: 'editorial-acid', sabbia: 'desert-heritage' };
      var saved = localStorage.getItem('pubgame-theme');
      var theme = legacy[saved] || (themes.indexOf(saved) !== -1 ? saved : 'editorial-acid');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { }
  </script>

  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512x512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- N-10: i font della domanda sono già in memoria al primo paint; niente
       scambio di font quando entra la prima domanda del Quiz. -->
  <link rel="preload" href="assets/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/space-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/space-mono-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<app-root></app-root>
<noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
