<div class="roulette-container">
  <div class="instructions" [class.is-empty]="isSpinning() || showWinner() || timer <= 0">
    <h2>🎰 SCEGLI IL TUO COLORE!</h2>
    <p class="timer-text">{{ timer }} secondi rimanenti</p>
  </div>

  <div class="roulette-stage">

    <div class="pointer-container">
      <div class="pointer-pivot"></div>
      <div
        class="pointer"
        [class.suspense]="pointerSuspense()"
        [style.transform]="'rotate(' + pointerAngle() + 'deg)'"
      ></div>
    </div>

    <div class="wheel-wrapper">
      <svg class="wheel-svg" viewBox="0 0 100 100" [style.transform]="'rotate(' + wheelRotation() + 'deg)'">
        <g>
          @for (color of segments(); track $index) {
            <path [attr.d]="getSlicePath($index, segments().length)" [attr.fill]="colorMap[color]"
                  class="segment-path"/>
          }
        </g>

        <g class="pegs-group">
          @for (seg of segments(); track $index) {
            <circle [attr.cx]="50 + 46.5 * Math.cos(($index * (360 / segments().length) - 90) * Math.PI / 180)"
                    [attr.cy]="50 + 46.5 * Math.sin(($index * (360 / segments().length) - 90) * Math.PI / 180)" r="0.9"
                    class="peg"/>
          }
        </g>

        <g class="dividers-group">
          @for (seg of segments(); track $index) {
            <line x1="50" y1="50"
                  [attr.x2]="50 + 50 * Math.cos(($index * (360 / segments().length) - 90) * Math.PI / 180)"
                  [attr.y2]="50 + 50 * Math.sin(($index * (360 / segments().length) - 90) * Math.PI / 180)"
                  stroke="rgba(21,21,15,0.55)" stroke-width="0.28"/>
          }
        </g>
      </svg>

      <div class="wheel-center">
        <div class="center-inner">
          <div class="center-icon">🎲</div>
          <div class="center-text">CASINO</div>
        </div>
      </div>

      <div class="wheel-border"></div>
    </div>
  </div>

  @if (showWinner()) {
    <div class="winner-announcement">
      <div class="winner-kicker">LA PALLINA SI FERMA SU</div>
      <div class="winner-color" [style.background]="colorMap[winningColor()!]">
        <span class="winner-color-label">{{ winningColor() }}</span>
      </div>
      <div class="winner-title">COLORE VINCENTE!</div>
    </div>
  }
</div>
