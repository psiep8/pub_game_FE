spring:
  application:
    name: pub_game_BE
  datasource:
    # File H2, non in memoria: un riavvio del backend ritrova partita, round,
    # risposte confermate e storico delle domande. Il percorso è relativo alla
    # cartella di avvio del backend (apps/backend/data).
    url: ${DB_URL:jdbc:h2:file:./data/pubgame;DB_CLOSE_DELAY=-1}
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      # Non esporre una console SQL sulla rete della partita.
      enabled: false

server:
  # Porta e interfaccia arrivano da .env tramite SERVER_PORT / SERVER_ADDRESS.
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

tmdb:
  api:
    key: ${TMDB_API_KEY:}

game:
  # Affidabilità: la finestra di risposta è decisa dal server, l'heartbeat
  # distingue un telefono collegato da uno che ha perso il Wi-Fi.
  reliability:
    answer-window-seconds: ${ANSWER_WINDOW_SECONDS:300}
    heartbeat-timeout-seconds: ${HEARTBEAT_TIMEOUT_SECONDS:25}
    event-history-limit: 200
  difficulty-levels:
    facile: "domande per bambini o cultura generale molto basilare. Risposte ovvie."
    medio: "domande per adulti mediamente istruiti. Richiedono riflessione."
    difficile: "domande da esperti, dettagli storici precisi, concetti scientifici avanzati."
  # URL pubblico del backend per servire canzoni e foto locali.
  # Di norma viene ricavato dalla richiesta in corso; questo è il ripiego.
  media-base-url: ${MEDIA_BASE_URL:}
