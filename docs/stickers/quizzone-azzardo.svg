<svg xmlns="http://www.w3.org/2000/svg" width="90mm" height="90mm" aria-labelledby="title desc" role="img" viewBox="0 0 1200 1200"><desc id="desc">Adesivo tondo quizzOne «Azzardo»: logo del gioco su palette Premium Gold, texture stampata e contorno di taglio CutContour.</desc><defs><clipPath id="clip"><use href="#badge"/></clipPath><pattern id="texture" width="20" height="20" patternUnits="userSpaceOnUse"><path fill="none" stroke="#d4af37" stroke-width="1.4" d="M0 3h20M0 8h20M0 13h20M0 18h20"/></pattern><circle id="badge" cx="600" cy="600" r="560"/></defs><g id="Fondo"><use fill="#b08d57" href="#badge" transform="translate(18 18)"/><use fill="#f7e7ce" stroke="#f7e7ce" stroke-width="48" href="#badge"/><use fill="#101820" stroke="#f7e7ce" stroke-width="7" href="#badge"/></g><g id="Texture"><g clip-path="url(#clip)" opacity=".75"><rect width="1200" height="1200" fill="url(#texture)"/></g></g><g id="Logo" transform="translate(204 204)scale(1.32)"><ellipse cx="300" cy="424" fill="#d4af37" stroke="#101820" stroke-width="14" rx="168" ry="52"/><ellipse cx="300" cy="372" fill="#d4af37" stroke="#101820" stroke-width="14" rx="168" ry="52"/><ellipse cx="300" cy="320" fill="#f7e7ce" stroke="#101820" stroke-width="14" rx="168" ry="52"/><ellipse cx="300" cy="320" fill="none" stroke="#d4af37" stroke-dasharray="20 14" stroke-width="12" rx="104" ry="30"/><circle cx="300" cy="320" r="18" fill="#d4af37"/></g><g id="CutContour" fill="none" stroke="#F0F" stroke-width=".588" data-spot-color="CutContour" data-tratto=".25pt"><use href="#badge"/></g></svg>