<div class="kahoot-leaderboard" [@fadeIn]>

  <div class="header">
    <h1 class="title">CLASSIFICA</h1>
    <div class="subtitle">Dal peggiore al migliore...</div>
  </div>

  <div class="players-container">
    @for (player of visiblePlayers(); track player.playerName) {
      <div class="player-row"
           [class.top3]="player.position <= 3"
           [class.gold]="player.position === 1"
           [class.silver]="player.position === 2"
           [class.bronze]="player.position === 3"
           [@slideUp]>

        <div class="position-badge" [class.podium]="player.position <= 3">
          {{ player.position }}
        </div>

        <div class="player-name">{{ player.playerName }}</div>

        <div class="player-points">
          <span class="points-value">{{ player.totalPoints }}</span>
          <span class="points-label">pts</span>
        </div>

        @if (player.position === 1) {
          <div class="podium-icon">🥇</div>
        } @else if (player.position === 2) {
          <div class="podium-icon">🥈</div>
        } @else if (player.position === 3) {
          <div class="podium-icon">🥉</div>
        }
      </div>
    }
  </div>
</div>
