<div class="chrono-container">

  <!-- Domanda -->
  <div class="question-box">
    <h2 class="question-text">{{ displayData?.question }}</h2>
  </div>

  <!-- Slider Anno -->
  <div class="year-selector">
    <div class="year-display">
      <span class="year-value">{{ selectedYear }}</span>
    </div>

    <input
      type="range"
      class="year-slider"
      [min]="displayData?.minYear || 1900"
      [max]="displayData?.maxYear || 2024"
      [step]="displayData?.step || 1"
      [(ngModel)]="selectedYear"
    />

    <div class="year-range-labels">
      <span>{{ displayData?.minYear || 1900 }}</span>
      <span>{{ displayData?.maxYear || 2024 }}</span>
    </div>
  </div>

  <!-- Risposta corretta -->
  @if (displayData?.correctAnswer) {
    <div class="correct-answer-box">
      <div class="answer-label">ANNO CORRETTO:</div>
      <div class="answer-value">{{ displayData.correctAnswer }}</div>
    </div>
  }

  <!-- Timer -->
  <div class="timer-display">
    <div class="timer-circle">
      <svg width="120" height="120">
        <circle cx="60" cy="60" r="54" class="timer-bg"></circle>
        <circle cx="60" cy="60" r="54"
                class="timer-progress"
                [style.stroke-dashoffset]="339 - (339 * timer / 30)"></circle>
      </svg>
      <div class="timer-value">{{ timer }}</div>
    </div>
  </div>

</div>
