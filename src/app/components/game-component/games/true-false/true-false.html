<div class="truefalse-container">

  <!-- Domanda -->
  <div class="question-box">
    <h2 class="question-text">{{ displayData?.question }}</h2>
  </div>

  <!-- Opzioni -->
  <div class="options-grid">
    @for (option of safeOptions; track $index) {
      <div class="option-card"
           [class.correct]="displayData?.correctAnswer === option"
           [class.wrong]="displayData?.correctAnswer && displayData?.correctAnswer !== option">
        <div class="option-icon">
          @if (option === 'VERO') {
            ✓
          } @else {
            ✗
          }
        </div>
        <div class="option-text">{{ option }}</div>
      </div>
    }
  </div>

  <!-- 🔥 EXPLANATION quando revealed e risposta è FALSO -->
  @if (displayData?.correctAnswer === 'FALSO' && displayData?.explanation) {
    <div class="explanation-box">
      <div class="explanation-icon">💡</div>
      <div class="explanation-title">PERCHÉ È FALSO:</div>
      <div class="explanation-text">{{ displayData.explanation }}</div>
    </div>
  }

  <!-- Timer -->
  <div class="timer-display">
    <div class="timer-circle">
      <svg width="120" height="120">
        <circle cx="60" cy="60" r="54" class="timer-bg"></circle>
        <circle cx="60" cy="60" r="54"
                class="timer-progress"
                [style.stroke-dashoffset]="339 - (339 * timer / 30)"></circle>
      </svg>
      <div class="timer-value">{{ timer }}</div>
    </div>
  </div>

</div>
