services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: pubgame-backend:${PUBGAME_TAG:-latest}
    container_name: pubgame-backend
    restart: unless-stopped
    healthcheck:
      # La base Temurin ha bash: /dev/tcp basta per sapere che la porta ascolta.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 60s
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      CONTROL_SECRET: "${CONTROL_SECRET:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}"
      DB_URL: "jdbc:h2:file:/app/data/pubgame;DB_CLOSE_DELAY=-1"
      MEDIA_BASE_URL: "${MEDIA_BASE_URL:-}"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      ANSWER_WINDOW_SECONDS: "${ANSWER_WINDOW_SECONDS:-300}"
      HEARTBEAT_TIMEOUT_SECONDS: "${HEARTBEAT_TIMEOUT_SECONDS:-25}"
      JAVA_OPTS: "${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}"
    volumes:
      - pubgame-data:/app/data

volumes:
  pubgame-data:
